[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searchcve"
version = "1.0.0"
description = "A fast, SearchSploit-style CLI tool for searching CVEs live via official NVD REST API 2.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary (All Rights Reserved)" }
authors = [
    { name = "Prekarshamaxx123", email = "prekarshamaxx@github.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Prekarshamaxx123/searchcve"
Repository = "https://github.com/Prekarshamaxx123/searchcve"
"Author Profile" = "https://github.com/Prekarshamaxx123"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
searchcve = "searchcve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
